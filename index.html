    <title>Tablas con HTML y CSS</title>

    <tr>

        <td rowspan="2" colspan="2" id="cero"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRXjcIL3Bcxak5UscWPVA8OHvYf8RuiWoZrDw&s" width="150"; height="100";></td>
        </tr>
    </tr>

    </tr>

    </tr>

</table>

</html>
